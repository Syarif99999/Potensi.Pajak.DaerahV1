<script>

const N=x=>parseFloat(x)||0,R=x=>'Rp '+Math.round(x).toLocaleString('id-ID');

let S;try{S=JSON.parse(localStorage.getItem('ppd'))||def()}catch(e){S=def()}S.cfg={...def().cfg,...S.cfg};if(S.cfg.arH==='Tanah Grogot = 36\nKuaro = 70\nLong Ikis = 42\nLong Kali = 50\nBatu Sopang = 72\nLainnya = 42')S.cfg.arH=def().cfg.arH;if(S.cfg.arB==='Karaoke = 50\nBioskop = 50\nBiliar = 50\nPanti pijat = 50\nKetangkasan mesin = 50\nPusat kebugaran = 50\nRefleksi = 50')S.cfg.arB=def().cfg.arB;

// field 'kunci:Label:default:x' ; x = rincian tambahan (disembunyikan). default kosong = teks
const BASE=['nama:Nama usaha','kec:Kecamatan','alamat:Alamat'];
const parse=s=>s.map(x=>{const[k,l,d,x2]=x.split(':');return{k,l,d:d??'',x:x2=='x'}});
const lst=t=>t.split('\n').map(l=>l.split('=')).filter(a=>a[0].trim()).map(a=>({n:a[0].trim(),v:N(a[1])}));
const AK=['occ','fbar','rar','ar','arr','ark','rok'];
const MOD={hotel:{nama:'Hotel',f:['jml:Jumlah kamar:1','tarif:Tarif kamar per malam (Rp):0','occ:Asumsi okupansi (%):70','kategori:Kategori (melati/bintang)::x','jenis:Jenis kamar::x','tp:Tarif pajak (%):10:x','hari:Hari setahun:365:x','mkn:F&B harga makan/orang:0:x','mnm:F&B harga minum/orang:0:x','fbh:F&B jumlah hari:0:x','fbar:F&B asumsi okupansi (%):0:x','rj:Ruang rapat jumlah:0:x','rt:Ruang rapat tarif:0:x','rh:Ruang rapat hari:0:x','rp:Paket makanan/orang:0:x','ro:Paket jumlah orang:0:x','rar:Ruang rapat asumsi okupansi (%):0:x','oth:Pendapatan lainnya (Rp):0:x','fas:Fasilitas kamar::x','ota:Sumber tarif (OCR/OTA)::x'],
 c:v=>{const l=v.tp/100,a=v.jml*v.tarif*v.occ/100*l*v.hari,b=(v.mkn+v.mnm)*v.fbh*v.fbar/100*l,c=(v.rj*v.rt*v.rh+v.rp*v.ro*v.rar/100)*l,d=v.oth*l;return{Kamar:a,'Food & beverage':b,'Ruang pertemuan':c,Lainnya:d,Total:a+b+c+d}}}};
const HIB={
karaoke:['Karaoke',['kls:Tipe room (VIP, Large, dll)','jk:Jumlah kamar/hall:1','tk:Tarif kamar per jam (Rp):0','ar:Asumsi okupansi (%):70','je:Jam efektif/hari:8:x','pg:Pengunjung F&B/hari:0:x','hp:Harga rata-rata porsi:0:x','h:Hari setahun:365:x','tp:Tarif pajak (%):40:x'],v=>{const a=v.jk*v.tk*v.ar/100*v.je*v.h*v.tp/100,b=v.pg*v.hp*v.h*v.tp/100;return{Karaoke:a,'Restoran dalam karaoke':b,Total:a+b}}],
bioskop:['Bioskop',['kls:Kelas studio (reguler, premiere, dll)','hh:Pertunjukan/hari:0','kk:Kapasitas kursi:0','htm:HTM (Rp):0','ar:Asumsi okupansi (%):70','g:Jumlah theater:1:x','tp:Tarif pajak (%):10:x','h:Hari:365:x'],v=>({Total:v.g*v.hh*v.kk*v.ar/100*v.htm*v.tp/100*v.h})],
biliar:['Biliar',['kls:Tipe meja (reguler, VIP, dll)','m:Jumlah meja:1','t:Tarif/jam (Rp):0','ar:Asumsi okupansi (%):70','je:Jam efektif:8:x','tp:Tarif pajak (%):10:x','h:Hari:365:x'],v=>({Total:v.m*v.t*v.ar/100*v.je*v.tp/100*v.h})],
pijat:['Panti pijat',['kls:Tipe room/layanan','g:Jumlah room/bed:1','t:Tarif (Rp):0','to:Turn over/hari:0','ar:Asumsi okupansi (%):70','h:Hari:365:x','tp:Tarif pajak (%):10:x'],v=>({Total:v.g*v.t*v.ar/100*v.to*v.h*v.tp/100})],
tangkas:['Ketangkasan mesin',['jp:Jenis permainan','t:Tarif/mesin (Rp):0','m:Rata-rata mesin dipakai/hari:0','occ:Asumsi okupansi pengunjung (%):70','tp:Tarif pajak (%):10:x','h:Hari:365:x'],v=>({Total:v.t*v.m*v.occ/100*v.tp/100*v.h})],
fitness:['Pusat kebugaran',['jn:Jenis (fitness/senam)','kls:Kelas (reguler, VIP, dll)','a:Jumlah anggota:0','b:Biaya keanggotaan/bulan (Rp):0','bl:Jumlah bulan:12:x','tp:Tarif pajak (%):10:x'],v=>({Total:v.a*v.b*v.bl*v.tp/100})],
refleksi:['Refleksi',['kls:Tipe layanan','jr:Jumlah room:0','tr:Tarif room (Rp):0','arr:Asumsi okupansi room (%):70','to1:Turn over room:0','jk:Jumlah kursi:0:x','tk:Tarif kursi (Rp):0:x','ark:Asumsi okupansi kursi (%):70:x','to2:Turn over kursi:0:x','h1:Hari room:365:x','h2:Hari kursi:365:x','tp:Tarif pajak (%):10:x'],v=>({Total:(v.jr*v.tr*v.arr/100*v.to1*v.h1+v.jk*v.tk*v.ark/100*v.to2*v.h2)*v.tp/100})]};
// Reklame: NSR = NJOPR x masa/12; pajak = NSR x tarif
const REK=['nama:Nama/penyelenggara','kec:Kecamatan','alamat:Alamat','jenis:Jenis reklame','pjg:Panjang (m):0','lbr:Lebar (m):0','tinggi:Tinggi tiang (m):0','sisi:Jumlah sisi:1','masa:Masa (bulan):12','rok:Asumsi okupansi reklame (%):75','jml:Jumlah unit:1:x','hr:Jumlah hari (spanduk, suara, film):1:x','ket:Keterangan objek (titik pemasangan)::x'];
// Tabel NJOP reklame: Perbup Paser No. 41 Tahun 2020 (perubahan Perbup No. 20 Tahun 2011), Lampiran
// h = harga satuan [1 sisi, 2 sisi, >2 sisi] atau [harga tunggal]; per = jangka waktu dasar; area = dihitung per m2
const PB=[
{n:'Videotron/Megatron',per:'Tahun',sat:'m2',area:1,tarif:20,h:[2125000,2000000,2250000]},
{n:'Baleho/Billboard/Neon Box',per:'Tahun',sat:'m2',area:1,tarif:20,h:[1200000,1250000,1375000]},
{n:'Reklame Papan/Baleho',per:'Tahun',sat:'m2',area:1,tarif:20,h:[750000,875000,1000000]},
{n:'Spanduk/Umbul-umbul/Banner',per:'Hari',sat:'m2',area:1,sp:1,tarif:20,h:[20000]},
{n:'Reklame Melekat (stiker)',per:'Kali',sat:'lembar',tarif:10,h:[1750]},
{n:'Reklame Selebaran',per:'Kali',sat:'lembar',tarif:10,h:[1000]},
{n:'Reklame Berjalan roda 4',per:'Tahun',sat:'unit',tarif:20,h:[2500000]},
{n:'Reklame Berjalan roda 2',per:'Tahun',sat:'unit',tarif:20,h:[500000]},
{n:'Reklame Udara',per:'Tahun',sat:'lembar/balon',tarif:20,h:[3125000]},
{n:'Reklame Suara',per:'Hari',sat:'spot',tarif:20,h:[937500]},
{n:'Reklame Film/Slide',per:'Hari',sat:'film/slide',tarif:15,h:[437500]},
{n:'Reklame Peragaan',per:'Kali',sat:'peragaan',tarif:15,h:[437500]}];
const TIER=['1 sisi','2 sisi','lebih dari 2 sisi'];
function pbFind(x){const q=String(x||'').toLowerCase().trim();if(!q)return null;let r=PB.find(a=>a.n.toLowerCase()==q);if(r)return r;
 if(/videotron|megatron|led/.test(q))return PB[0];if(/papan/.test(q))return PB[2];if(/billboard|baliho|baleho|neon/.test(q))return PB[1];
 if(/spanduk|umbul|banner/.test(q))return PB[3];if(/melekat|stiker/.test(q))return PB[4];if(/selebaran/.test(q))return PB[5];
 if(/berjalan|kendaraan/.test(q))return /roda 2|motor|\b2\b/.test(q)?PB[7]:PB[6];if(/udara|balon/.test(q))return PB[8];if(/suara/.test(q))return PB[9];
 if(/film|slide/.test(q))return PB[10];if(/peragaan/.test(q))return PB[11];return null}
const pbName=x=>{const r=pbFind(x);return r?r.n:String(x||'')};
const pbHarga=(J,t)=>{const k=J.n+'#'+t,o=(S.cfg.rkh||{})[k];return o>0?o:J.h[Math.min(t,J.h.length-1)]};
S.rek.forEach(e=>{if(e.v)e.v.jenis=pbName(e.v.jenis)});
function calcRek(v){const J=pbFind(v.jenis),p0=N(v.pjg),l0=N(v.lbr);
 if(!J)return{'Luas (m2)':p0*l0,'Harga Perbup':0,NJOPR:0,NSR:0,Total:0};
 const sisi=Math.max(1,N(v.sisi)||1),h=pbHarga(J,J.h.length>1?(sisi>=3?2:sisi==2?1:0):0);
 let p=p0,l=l0;if(J.sp){p=p>0?Math.max(1,p):0;l=l>0?Math.max(1,l):0}
 const luas=J.area?p*l:1,jml=N(v.jml)||1,ks=J.area&&S.cfg.kaliSisi?sisi:1,
 per=J.per=='Tahun'?N(v.masa)/12:J.per=='Hari'?(v.hr==null||v.hr===''?1:N(v.hr)):1,
 njopr=h*luas*ks*jml,oc=J.per=='Tahun'&&N(v.rok)>0?N(v.rok)/100:1,nsr=njopr*per*oc;
 return{'Luas (m2)':J.area?luas:0,'Harga Perbup':h,NJOPR:njopr,NSR:nsr,Total:nsr*J.tarif/100}}
let q='',fk='',vw='daftar',tab='hotel',hibJ='karaoke',editIdx=null,ex=new Set(),cm='usaha',pf=null,HG=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(k,x)=>k.startsWith('Luas')?x.toLocaleString('id-ID'):R(x);
function inp(f,pre){const id='f_'+f.k,L=f.l+(AK.includes(f.k)?' <span class="au">· otomatis</span>':'');
 const sel=a=>`<div><label>${L}</label><select id="${id}">${a.map(k=>`<option>${k}</option>`).join('')}</select></div>`;
 if(f.k=='kec')return sel(KEC);if(f.k=='jenis'&&pre=='rek')return sel(PB.map(x=>x.n));
 const t=f.d!==''?'number':'text';
 const ch=(f.k=='kls'||(f.k=='jenis'&&pre=='hotel'))?pilihan(f.k=='kls'?hibJ:'hotel'):null;
 const chips=ch?`<div class="chips" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">${ch.map(x=>`<button type="button" class="btn l" style="padding:4px 10px;margin:0;font-size:13px" onclick="pilih('${id}',this.textContent)">${esc(x)}</button>`).join('')}</div>`:'';
 return`<div${f.k=='alamat'||ch?' style="grid-column:1/-1"':''}><label>${L}</label><input id="${id}" type="${t}" inputmode="${t=='number'?'decimal':'text'}" value="${f.d}" ${ch?'placeholder="Pilih di bawah atau ketik sendiri"':''}>${chips}</div>`}
const PIL={hotel:['Standard','Superior','Deluxe','Suite','Family','VIP'],karaoke:['VIP','Large','Medium','Small','Family','Reguler'],fitness:['Reguler','VIP','Premium','Harian','Kelas senam','Yoga'],biliar:['Reguler','VIP'],bioskop:['Reguler','Premiere','Sweetbox'],pijat:['Reguler','VIP'],refleksi:['Reguler','VIP'],tangkas:[]};
function pilihan(j){const old=j=='hotel'?S.hotel.map(e=>e.v.jenis):S.hib.filter(e=>e.j==j).map(e=>e.v.kls);return[...new Set([...(PIL[j]||[]),...old.map(x=>String(x||'').trim()).filter(Boolean)])]}
function pilih(id,t){const el=document.getElementById(id);if(!el)return;el.value=t;el.dispatchEvent(new Event('input',{bubbles:true}));const d=el.closest('details');if(d)d.open=true}
const FS=(m,j)=>m=='hotel'?[...parse(BASE),...parse(MOD.hotel.f)]:m=='hib'?[...parse(BASE),...parse(HIB[j][1])]:parse(REK);
const fieldsFor=m=>FS(m,hibJ),fieldsFor2=(m,e)=>FS(m,e.j);
function read(fs){const v={};fs.forEach(f=>{const e=document.getElementById('f_'+f.k);v[f.k]=f.d!==''?N(e.value):e.value});return v}
function calc(m,e){return m=='hotel'?MOD.hotel.c(e.v):m=='hib'?HIB[e.j][2](e.v):calcRek(e.v)}
function add(more){const fs=fieldsFor(tab),v=read(fs);if(!v.nama.trim()){alert('Isi nama usaha dulu.');return}
 const e={v};if(tab=='hib')e.j=hibJ;if(editIdx!=null){if(S[tab][editIdx]&&S[tab][editIdx].id)e.id=S[tab][editIdx].id;S[tab][editIdx]=e;editIdx=null}else S[tab].push(e);save();
 if(more){pf={nama:v.nama,kec:v.kec,alamat:v.alamat};if(tab=='hotel')pf.kategori=v.kategori;render();const el=document.getElementById(tab=='hib'?'f_kls':tab=='rek'?'f_pjg':'f_jenis');if(el){const d=el.closest('details');if(d)d.open=true;el.scrollIntoView({block:'center'});el.focus()}toast('Tersimpan. Isi '+(tab=='hib'?'tipe/kelas':tab=='rek'?'objek reklame':'jenis kamar')+' berikutnya.');return}
 render();scrollTo(0,0)}
let TR=[];try{TR=JSON.parse(localStorage.getItem('ppd_trash'))||[]}catch(e){}
let lastDel=null;
function trashAdd(m,list,why){if(!list.length)return;const t=Date.now(),b=uid();list.forEach(e=>TR.push({m,e:JSON.parse(JSON.stringify(e)),t,why,b}));TR=TR.slice(-1500);try{localStorage.setItem('ppd_trash',JSON.stringify(TR))}catch(x){}return b}
function undoable(b,n){if(!b)return;lastDel=b;toast(n+' data dihapus.',['Urungkan','undoLast()'],9000)}
function undoLast(){if(lastDel)restoreBatch(lastDel)}
function restoreBatch(b){const it=TR.filter(x=>x.b==b);let n=0;it.forEach(x=>{if(!S[x.m])return;if(!x.e.id||!S[x.m].some(z=>z.id==x.e.id)){S[x.m].push(x.e);n++}});TR=TR.filter(x=>x.b!=b);try{localStorage.setItem('ppd_trash',JSON.stringify(TR))}catch(e){}editIdx=null;save();render();toast(n+' data dipulihkan.')}
function emptyTrash(){if(!confirm('Kosongkan semua data terhapus? Setelah ini tidak bisa dipulihkan lagi.'))return;TR=[];try{localStorage.setItem('ppd_trash',JSON.stringify(TR))}catch(e){}render()}

biliar:['<code>jumlah meja × tarif per jam × okupansi% × jam efektif × tarif pajak% × hari</code>'],
pijat:['<code>jumlah room/bed × tarif × okupansi% × turn over per hari × hari × tarif pajak%</code>'],
tangkas:['<code>tarif per mesin × mesin dipakai per hari × okupansi% × tarif pajak% × hari</code>'],
fitness:['<code>jumlah anggota × biaya per bulan × jumlah bulan × tarif pajak%</code>'],
refleksi:['<code>(room × tarif × okupansi% × turn over × hari + kursi × tarif × okupansi% × turn over × hari) × tarif pajak%</code>'],
rek:['Dasar: Perbup Paser No. 41 Tahun 2020 (perubahan Perbup No. 20 Tahun 2011). Harga satuan (NJOP) tiap jenis reklame ada di tabel Lampiran.','<b>Reklame per m2</b> (videotron, billboard/neon box, papan/baleho, spanduk): <code>NJOPR = harga satuan × panjang × lebar × jumlah sisi × jumlah unit</code>. Harga satuan dibedakan menurut jumlah sisi (1, 2, lebih dari 2).','<b>Reklame per unit/lembar/spot</b> (berjalan, udara, suara, film, melekat, selebaran, peragaan): <code>NJOPR = harga satuan × jumlah</code>','<b>NSR</b> = <code>NJOPR × jangka waktu × asumsi okupansi%</code> (asumsi okupansi hanya untuk jenis per tahun, kalau kosong dihitung 100%; ini asumsi estimasi potensi, bukan ketentuan Perbup). Jangka waktu: masa (bulan) ÷ 12 untuk jenis per tahun, jumlah hari untuk jenis per hari, 1 untuk jenis per kali.','<b>Pajak reklame</b> = <code>NSR × tarif pajak jenis itu</code> (20% videotron, billboard, papan, spanduk, berjalan, udara, suara; 15% film dan peragaan; 10% melekat dan selebaran).','Spanduk/umbul-umbul/banner yang ukurannya kurang dari 1 meter dihitung 1 meter (Pasal 7A ayat 4).']};

// ---- sinkron Firebase (Firestore, project sama dengan Geo Foto Lapangan) ----
const COL_E='potensi_entries',COL_C='potensi_cfg',MODS=['hotel','hib','rek'];
let DB=null,SY={},syncT=null,cfgSyn=localStorage.getItem('ppd_cfgsyn')||'',ready=false,firstSnap=false;
try{SY=JSON.parse(localStorage.getItem('ppd_sync'))||{}}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function ensureIds(){MODS.forEach(m=>S[m].forEach(e=>{if(!e.id)e.id=uid()}))}
const CST={off:'Cloud nonaktif',wait:'Menyinkron…',ok:'☁ Tersinkron',err:'⚠ Belum tersinkron (ketuk untuk coba lagi)',rules:'⚠ Aturan Firestore belum mengizinkan'};
const setCS=k=>{const e=document.getElementById('cs');if(e)e.textContent=CST[k]||k};
const persist=()=>{localStorage.setItem('ppd',JSON.stringify(S));localStorage.setItem('ppd_sync',JSON.stringify(SY));localStorage.setItem('ppd_cfgsyn',cfgSyn)};
function pushSoon(){if(!DB||!ready)return;clearTimeout(syncT);setCS('wait');syncT=setTimeout(push,700)}
async function push(){if(!DB||!ready)return;setCS('wait');try{const ops=[],cur={},ts=firebase.firestore.FieldValue.serverTimestamp();
 MODS.forEach(m=>S[m].forEach(e=>{const j=JSON.stringify(e);cur[e.id]=1;if(SY[e.id]!==j)ops.push(['set',e.id,m,j])}));
 Object.keys(SY).forEach(id=>{if(!cur[id])ops.push(['del',id])});
 const cj=JSON.stringify(S.cfg);if(cj!==cfgSyn&&(cfgSyn!==''||cj!==JSON.stringify(def().cfg)))ops.push(['cfg',cj]);
 for(let i=0;i<ops.length;i+=400){const part=ops.slice(i,i+400),b=DB.batch();
  part.forEach(o=>{if(o[0]=='set')b.set(DB.collection(COL_E).doc(o[1]),{modul:o[2],data:o[3],t:ts});else if(o[0]=='del')b.delete(DB.collection(COL_E).doc(o[1]));else b.set(DB.collection(COL_C).doc('main'),{data:o[1],t:ts})});
  await b.commit();part.forEach(o=>{if(o[0]=='set')SY[o[1]]=o[3];else if(o[0]=='del')delete SY[o[1]];else cfgSyn=o[1]})}
 persist();setCS('ok')}catch(e){setCS(e&&e.code=='permission-denied'?'rules':'err')}}
function softRender(){if(editIdx!=null&&!S[tab][editIdx])editIdx=null;const a=document.activeElement,fid=a&&a.id,vals={},man={},y=scrollY;
 document.querySelectorAll('#view [id^="f_"]').forEach(el=>{vals[el.id]=el.value;if(el.dataset.man)man[el.id]=1});const op=document.querySelector('#view details.ex')?.open;
 render();Object.entries(vals).forEach(([id,v])=>{const el=document.getElementById(id);if(el){el.value=v;if(man[id])el.dataset.man=1}});
 if(op){const d=document.querySelector('#view details.ex');if(d)d.open=true}live();scrollTo(0,y);if(fid){const el=document.getElementById(fid);if(el)el.focus()}}
function listen(){
 DB.collection(COL_E).onSnapshot(sn=>{let ch=false;
  sn.docChanges().forEach(c=>{const d=c.doc;
   if(c.type=='removed'){MODS.forEach(m=>{const i=S[m].findIndex(e=>e.id==d.id);if(i>=0){trashAdd(m,[S[m][i]],'dihapus dari perangkat lain');S[m].splice(i,1);ch=true}});delete SY[d.id];return}
   if(d.metadata.hasPendingWrites)return;const x=d.data(),m=x.modul;if(!S[m])return;let e;try{e=JSON.parse(x.data)}catch(_){return}
   e.id=d.id;const j=JSON.stringify(e),i=S[m].findIndex(z=>z.id==d.id);
   if(i<0){S[m].push(e);ch=true}else if(JSON.stringify(S[m][i])!==j){S[m][i]=e;ch=true}SY[d.id]=j});
  if(!firstSnap&&!sn.metadata.fromCache){firstSnap=true;const ids=new Set(sn.docs.map(d=>d.id));
   MODS.forEach(m=>{const n=S[m].length,gone=S[m].filter(e=>SY[e.id]&&!ids.has(e.id));trashAdd(m,gone,'tidak ada lagi di cloud');S[m]=S[m].filter(e=>!SY[e.id]||ids.has(e.id));if(S[m].length!=n)ch=true});Object.keys(SY).forEach(id=>{if(!ids.has(id))delete SY[id]});ready=true}
  if(ch){persist();softRender()}if(ready)pushSoon()},err=>setCS(err.code=='permission-denied'?'rules':'err'));
 DB.collection(COL_C).doc('main').onSnapshot(d=>{if(!d.exists||d.metadata.hasPendingWrites)return;let c;try{c=JSON.parse(d.data().data)}catch(_){return}
  const loc=JSON.stringify(S.cfg);if(cfgSyn===''&&loc!==JSON.stringify(def().cfg))return;
  const n={...def().cfg,...c};if(JSON.stringify(n)===loc){cfgSyn=loc;persist();return}S.cfg=n;cfgSyn=JSON.stringify(S.cfg);persist();softRender()},()=>{})}
function initFB(){ensureIds();localStorage.setItem('ppd',JSON.stringify(S));
 if(typeof firebase==='undefined'||typeof FIREBASE_CONFIG==='undefined'||/PASTE_/.test(JSON.stringify(FIREBASE_CONFIG)))return setCS('off');
 setCS('wait');try{firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().signInAnonymously().then(()=>{DB=firebase.firestore();listen()}).catch(()=>setCS('err'))}catch(e){setCS('err')}}
