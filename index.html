<style>

<header><div class="br"><img src="logo.png" alt="Lambang Kabupaten Paser"><div><h1>Potensi Pajak Daerah</h1><small>BAPENDA Kabupaten Paser</small><br><small id="cs" onclick="push()" style="cursor:pointer"></small></div><button id="ins" class="btn o" style="display:none;margin:0 0 0 auto" onclick="installApp()">Install</button></div><nav id="nav"></nav></header>

<script>
const KEC=['Batu Engau','Batu Sopang','Kuaro','Long Ikis','Long Kali','Muara Komam','Muara Samu','Pasir Belengkong','Tanah Grogot','Tanjung Harapan','Belum diisi'];
const N=x=>parseFloat(x)||0,R=x=>'Rp '+Math.round(x).toLocaleString('id-ID');
const def=()=>({hotel:[],hib:[],rek:[],cfg:{auto:true,arH:'Tanah Grogot = 36\nKuaro = 70\nLong Ikis = 42\nLong Kali = 50\nBatu Sopang = 72\nLainnya = 42',arB:'Karaoke = 50\nBioskop = 50\nBiliar = 50\nPanti pijat = 50\nKetangkasan mesin = 50\nPusat kebugaran = 50\nRefleksi = 50',tarif:20,jenis:'Billboard = 0\nBaliho = 0\nPapan nama = 0\nSpanduk = 0\nVideotron = 0\nNeon box = 0',lokasi:''}});
let S;try{S=JSON.parse(localStorage.getItem('ppd'))||def()}catch(e){S=def()}S.cfg={...def().cfg,...S.cfg};
const save=()=>{ensureIds();localStorage.setItem('ppd',JSON.stringify(S));pushSoon()};
// field 'kunci:Label:default:x' ; x = rincian tambahan (disembunyikan). default kosong = teks
const BASE=['nama:Nama usaha','kec:Kecamatan','alamat:Alamat'];
const parse=s=>s.map(x=>{const[k,l,d,x2]=x.split(':');return{k,l,d:d??'',x:x2=='x'}});
const lst=t=>t.split('\n').map(l=>l.split('=')).filter(a=>a[0].trim()).map(a=>({n:a[0].trim(),v:N(a[1])}));
const AK=['occ','fbar','rar','ar','arr','ark'];
const MOD={hotel:{nama:'Hotel',f:['jml:Jumlah kamar:1','tarif:Tarif kamar per malam (Rp):0','occ:Okupansi (%):50','kategori:Kategori (melati/bintang)::x','jenis:Jenis kamar::x','tp:Tarif pajak (%):10:x','hari:Hari setahun:365:x','mkn:F&B harga makan/orang:0:x','mnm:F&B harga minum/orang:0:x','fbh:F&B jumlah hari:0:x','fbar:F&B okupansi (%):0:x','rj:Ruang rapat jumlah:0:x','rt:Ruang rapat tarif:0:x','rh:Ruang rapat hari:0:x','rp:Paket makanan/orang:0:x','ro:Paket jumlah orang:0:x','rar:Ruang rapat okupansi (%):0:x','oth:Pendapatan lainnya (Rp):0:x'],
 c:v=>{const l=v.tp/100,a=v.jml*v.tarif*v.occ/100*l*v.hari,b=(v.mkn+v.mnm)*v.fbh*v.fbar/100*l,c=(v.rj*v.rt*v.rh+v.rp*v.ro*v.rar/100)*l,d=v.oth*l;return{Kamar:a,'Food & beverage':b,'Ruang pertemuan':c,Lainnya:d,Total:a+b+c+d}}}};
const HIB={
karaoke:['Karaoke',['jk:Jumlah kamar/hall:1','tk:Tarif kamar per jam (Rp):0','ar:Okupansi (%):30','je:Jam efektif/hari:8:x','pg:Pengunjung F&B/hari:0:x','hp:Harga rata-rata porsi:0:x','h:Hari setahun:365:x','tp:Tarif pajak (%):40:x'],v=>{const a=v.jk*v.tk*v.ar/100*v.je*v.h*v.tp/100,b=v.pg*v.hp*v.h*v.tp/100;return{Karaoke:a,'Restoran dalam karaoke':b,Total:a+b}}],
bioskop:['Bioskop',['hh:Pertunjukan/hari:0','kk:Kapasitas kursi:0','htm:HTM (Rp):0','ar:Okupansi (%):0','g:Jumlah theater:1:x','tp:Tarif pajak (%):10:x','h:Hari:365:x'],v=>({Total:v.g*v.hh*v.kk*v.ar/100*v.htm*v.tp/100*v.h})],
biliar:['Biliar',['m:Jumlah meja:1','t:Tarif/jam (Rp):0','ar:Okupansi (%):0','je:Jam efektif:8:x','tp:Tarif pajak (%):10:x','h:Hari:365:x'],v=>({Total:v.m*v.t*v.ar/100*v.je*v.tp/100*v.h})],
pijat:['Panti pijat',['g:Jumlah room/bed:1','t:Tarif (Rp):0','to:Turn over/hari:0','ar:Okupansi (%):0','h:Hari:365:x','tp:Tarif pajak (%):10:x'],v=>({Total:v.g*v.t*v.ar/100*v.to*v.h*v.tp/100})],
tangkas:['Ketangkasan mesin',['t:Tarif/mesin (Rp):0','m:Rata-rata mesin dipakai/hari:0','occ:Okupansi pengunjung (%):0','tp:Tarif pajak (%):10:x','h:Hari:365:x'],v=>({Total:v.t*v.m*v.occ/100*v.tp/100*v.h})],
fitness:['Pusat kebugaran',['a:Jumlah anggota:0','b:Biaya keanggotaan/bulan (Rp):0','bl:Jumlah bulan:12:x','tp:Tarif pajak (%):10:x'],v=>({Total:v.a*v.b*v.bl*v.tp/100})],
refleksi:['Refleksi',['jr:Jumlah room:0','tr:Tarif room (Rp):0','arr:Okupansi room (%):0','to1:Turn over room:0','jk:Jumlah kursi:0:x','tk:Tarif kursi (Rp):0:x','ark:Okupansi kursi (%):0:x','to2:Turn over kursi:0:x','h1:Hari room:365:x','h2:Hari kursi:365:x','tp:Tarif pajak (%):10:x'],v=>({Total:(v.jr*v.tr*v.arr/100*v.to1*v.h1+v.jk*v.tk*v.ark/100*v.to2*v.h2)*v.tp/100})]};
// Reklame: NSR = NJOPR x masa/12; pajak = NSR x tarif
const REK=['nama:Nama/penyelenggara','kec:Kecamatan','alamat:Alamat','jenis:Jenis reklame','pjg:Panjang (m):0','lbr:Lebar (m):0','tinggi:Tinggi tiang (m):0','sisi:Jumlah sisi:1','masa:Masa (bulan):12','jml:Jumlah unit:1:x'];
function calcRek(v){const J=lst(S.cfg.jenis).find(x=>x.n==v.jenis),luas=v.pjg*v.lbr,
 njopr=luas*v.sisi*v.jml*(J?J.v:0),nsr=njopr*v.masa/12;
 return{'Luas (m2)':luas,NJOPR:njopr,NSR:nsr,Total:nsr*N(S.cfg.tarif)/100}}
let fk='',vw='daftar',tab='hotel',hibJ='karaoke',editIdx=null,ex=new Set(),cm='usaha',pf=null,HG=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(k,x)=>k.startsWith('Luas')?x.toLocaleString('id-ID'):R(x);
function inp(f,pre){const id='f_'+f.k,L=f.l+(AK.includes(f.k)?' <span class="au">· otomatis</span>':'');
 const sel=a=>`<div><label>${L}</label><select id="${id}">${a.map(k=>`<option>${k}</option>`).join('')}</select></div>`;
 if(f.k=='kec')return sel(KEC);if(f.k=='jenis'&&pre=='rek')return sel(lst(S.cfg.jenis).map(x=>x.n));
 const t=f.d!==''?'number':'text';return`<div${f.k=='alamat'?' style="grid-column:1/-1"':''}><label>${L}</label><input id="${id}" type="${t}" inputmode="${t=='number'?'decimal':'text'}" value="${f.d}"></div>`}
const FS=(m,j)=>m=='hotel'?[...parse(BASE),...parse(MOD.hotel.f)]:m=='hib'?[...parse(BASE),...parse(HIB[j][1])]:parse(REK);
const fieldsFor=m=>FS(m,hibJ),fieldsFor2=(m,e)=>FS(m,e.j);
function read(fs){const v={};fs.forEach(f=>{const e=document.getElementById('f_'+f.k);v[f.k]=f.d!==''?N(e.value):e.value});return v}
function calc(m,e){return m=='hotel'?MOD.hotel.c(e.v):m=='hib'?HIB[e.j][2](e.v):calcRek(e.v)}
function add(){const fs=fieldsFor(tab),v=read(fs);if(!v.nama.trim()){alert('Isi nama usaha dulu.');return}
 const e={v};if(tab=='hib')e.j=hibJ;if(editIdx!=null){S[tab][editIdx]=e;editIdx=null}else S[tab].push(e);save();render();scrollTo(0,0)}
function del(i){if(confirm('Hapus data ini? Data yang dihapus tidak bisa dikembalikan.')){S[tab].splice(i,1);editIdx=null;ex.clear();save();render()}}
function delHG(gi){const o=HG[gi][1];if(confirm('Hapus '+o.n+' beserta '+o.ix.length+' jenis kamar? Tidak bisa dikembalikan.')){const rm=new Set(o.ix);S.hotel=S.hotel.filter((e,i)=>!rm.has(i));editIdx=null;ex.clear();save();render()}}
function rows(m){return fidx(m).map((i,n)=>{const e=S[m][i],fs=fieldsFor2(m,e),o={No:n+1};if(m=='hib')o['Jenis hiburan']=HIB[e.j][0];fs.forEach(f=>o[f.l]=e.v[f.k]);Object.entries(calc(m,e)).forEach(([k,x])=>o[k=='Total'?'Potensi pajak (Rp)':k]=Math.round(x*100)/100);return o})}
const tot=m=>S[m].reduce((s,e)=>s+calc(m,e).Total,0);
const fidx=m=>S[m].map((e,i)=>i).filter(i=>!fk||(S[m][i].v.kec||'Belum diisi')==fk),totF=m=>fidx(m).reduce((s,i)=>s+calc(m,S[m][i]).Total,0);
const NM={hotel:'Hotel',hib:'Kesenian & hiburan',rek:'Reklame'};
function file(n,ext){return`potensi-${n}${fk&&n!='cadangan'?'-'+fk.toLowerCase().replace(/\s+/g,'-'):''}-${new Date().toISOString().slice(0,10)}.${ext}`}
function csv(m){const r=rows(m);if(!r.length)return alert('Belum ada data.');const h=[...new Set(r.flatMap(Object.keys))],q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const t='\ufeff'+[h.map(q).join(','),...r.map(o=>h.map(k=>q(o[k])).join(','))].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=file(m,'csv');a.click()}
function xl(all){const wb=XLSX.utils.book_new(),ms=all?['hotel','hib','rek']:[tab];let any=0;
 ms.forEach(m=>{const r=rows(m);if(r.length){any=1;XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),NM[m].slice(0,31))}});
 if(all){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Jenis pajak','Jumlah objek','Potensi pajak (Rp)'],...['hotel','hib','rek'].map(m=>[NM[m],fidx(m).length,Math.round(totF(m))]),['Total','',Math.round(totF('hotel')+totF('hib')+totF('rek'))]]),'Ringkasan');any=1}
 if(!any)return alert('Belum ada data.');XLSX.writeFile(wb,file(all?'semua':tab,'xlsx'))}
function saveCfg(){const g=i=>document.getElementById(i);S.cfg.tarif=N(g('c_t').value);S.cfg.jenis=g('c_j').value;save();render()}
function saveAR(){const g=i=>document.getElementById(i);S.cfg.auto=g('a_on').checked;if(g('a_h'))S.cfg.arH=g('a_h').value;if(g('a_b'))S.cfg.arB=g('a_b').value;save();render()}
// ---- okupansi otomatis: rata-rata data tersimpan (kecamatan / jenis yang sama), kalau belum ada pakai tabel awal ----
const look=(t,n)=>{const l=lst(t),f=l.find(x=>x.n.toLowerCase()==String(n).toLowerCase())||l.find(x=>x.n.toLowerCase()=='lainnya');return f?f.v:null};
function autoVal(){const el=k=>document.getElementById('f_'+k);let a;
 if(tab=='hotel'){const kc=el('kec').value;a=S.hotel.filter(e=>e.v.kec==kc&&e.v.occ>0).map(e=>e.v.occ);if(!a.length)return look(S.cfg.arH,kc)}
 else{a=S.hib.filter(e=>e.j==hibJ).map(e=>e.v.ar??e.v.occ??e.v.arr).filter(x=>x>0);if(!a.length)return look(S.cfg.arB,HIB[hibJ][0])}
 return Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10}
function applyAR(){if(!S.cfg.auto||tab=='rek')return;const v=autoVal();if(v==null)return;AK.forEach(k=>{const e=document.getElementById('f_'+k);if(e&&!e.dataset.man)e.value=v})}
function chg(ev){const t=ev.target;if(AK.includes(t.id.slice(2)))t.dataset.man=1;if(t.id=='f_kec'&&tab=='hotel'){AK.forEach(k=>{const e=document.getElementById('f_'+k);if(e)delete e.dataset.man});applyAR()}live()}
function live(){let c;try{c=calc(tab,{v:read(fieldsFor(tab)),j:hibJ})}catch(e){return}
 const d=Object.entries(c).filter(([k,x])=>k!='Total'&&Object.keys(c).length>2).map(([k,x])=>`<span>${k}: ${fmt(k,x)}</span>`).join('');
 document.getElementById('live').innerHTML=`<div class="t"><span>${tab=='rek'?'Pajak reklame per tahun':'Potensi pajak per tahun'}</span><b>${fmt('Total',c.Total)}</b></div>${d?`<div class="d">${d}</div>`:''}`}
// ---- import ----
const pc=x=>{x=N(x);return x<=1?x*100:x};
function kecM(t){t=String(t).toLowerCase();if(/\btgt\b/.test(t))return'Tanah Grogot';return KEC.find(k=>t.includes(k.toLowerCase()))||'Belum diisi'}
function impHotel(a){const kec=kecM(a[1]?.[0]);let nm='',al='',kt='',c=0;
 for(let i=6;i<a.length;i++){const r=a[i];if(String(r[1]).trim()){nm=String(r[1]).trim();al=String(r[2]).trim()}if(String(r[6]).trim())kt=String(r[6]).trim();if(!(N(r[8])>0)||!nm)continue;
  S.hotel.push({v:{nama:nm,alamat:al,kec,kategori:kt,jenis:String(r[7]).trim(),jml:N(r[8]),tarif:N(r[9]),occ:pc(r[10]),tp:r[11]===''?10:pc(r[11]),hari:N(r[12])||365,mkn:N(r[14]),mnm:N(r[15]),fbh:N(r[16]),fbar:pc(r[17]),rj:N(r[19]),rt:N(r[20]),rh:N(r[21]),rp:N(r[22]),ro:N(r[23]),rar:pc(r[24]),oth:N(r[26])}});c++}return c}
function impKar(a){let c=0;for(let i=6;i<a.length;i++){const r=a[i];if(!String(r[1]).trim()||!(N(r[6])>0))continue;
 S.hib.push({j:'karaoke',v:{nama:String(r[1]).trim(),alamat:String(r[2]).trim(),kec:kecM(r[2]),jk:N(r[6]),tk:N(r[7]),ar:pc(r[8]),je:N(r[9]),pg:N(r[10]),hp:N(r[11]),h:N(r[12])||365,tp:pc(r[13])||40}});c++}return c}
function impOwn(sn,a){if(!a[0]||!(a[0].includes('Nama usaha')||a[0].includes('Nama/penyelenggara'))||sn=='Ringkasan')return 0;const m=Object.keys(NM).find(k=>NM[k].slice(0,31)==sn)||tab;let c=0;
 a.slice(1).forEach(r=>{const o={};a[0].forEach((h,i)=>o[h]=r[i]);if(!String(o['Nama usaha']??o['Nama/penyelenggara']??'').trim())return;let e={},fs;
  if(m=='hib'){const j=Object.keys(HIB).find(k=>HIB[k][0]==o['Jenis hiburan']);if(!j)return;e.j=j;fs=FS('hib',j)}else fs=FS(m);
  e.v={};fs.forEach(f=>e.v[f.k]=f.d!==''?N(o[f.l]):String(o[f.l]??''));S[m].push(e);c++});return c}
const GH={nama:/nama/i,alamat:/alamat/i,kec:/kecamatan|kec\./i,jml:/jumlah\s*kamar|jml.*kamar/i,tarif:/(tarif|harga).*kamar/i,occ:/okupansi|hunian/i};
function impGen(a){let hi=-1,mp;
 for(let i=0;i<Math.min(a.length,20)&&hi<0;i++){const m={};a[i].forEach((c,j)=>{const t=String(c);for(const k in GH)if(m[k]==null&&GH[k].test(t)&&!(k=='nama'&&/pemilik|npwpd|kode|petugas/i.test(t)))m[k]=j});if(m.nama!=null&&(m.alamat!=null||m.kec!=null)){hi=i;mp=m}}
 if(hi<0)return 0;let c=0;
 a.slice(hi+1).forEach(r=>{const nm=String(r[mp.nama]??'').trim();if(!nm)return;const v={};
  FS(tab,hibJ).forEach(x=>v[x.k]=x.d!==''?N(x.d):'');
